
name: VYGO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear plataforma Android
        run: flutter create --platforms=android .

      - name: Agregar permiso de Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in content:
              marker = "<application"
              if marker not in content:
                  raise SystemExit("No se encontró la etiqueta application")

              content = content.replace(
                  marker,
                  permission + "\n    " + marker,
                  1
              )
              manifest.write_text(content)

          print("Permiso de Internet verificado correctamente.")
          PY

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VYGO-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
